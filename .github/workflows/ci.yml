name: CI

# Runs on every push and pull request to main. The suites are fast enough
# (a few seconds each) that there is no reason to run them on a schedule
# instead and find out days later.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movie-review-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: movie-review-frontend/package-lock.json

      - run: npm ci

      - name: Tests
        run: npm test

      # A green suite with a broken build helps nobody, and the build is the
      # thing that actually ships.
      - name: Build
        run: npm run build
        env:
          # The client throws at startup without this, by design: it refuses
          # to guess a backend and silently write to the wrong database.
          VITE_API_BASE_URL: http://localhost:5001
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder
          VITE_FIREBASE_MESSAGING_SENDER_ID: ci-placeholder
          VITE_FIREBASE_APP_ID: ci-placeholder
          VITE_FIREBASE_MEASUREMENT_ID: ci-placeholder

      - name: Dependency audit
        run: npm audit --audit-level=high

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movie-review-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: movie-review-backend/package-lock.json

      - run: npm ci

      # These suites are pure: validators, the auth gate with a stubbed
      # verifier, the route table and the cache. No database, no API keys,
      # nothing to provision.
      - name: Tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high
