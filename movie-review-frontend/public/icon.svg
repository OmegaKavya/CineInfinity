<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CineInfinity">
  <!-- The omega, which is the mark used on Your Signal, over the app's own
       gradient. A letterform rather than a film reel: a reel at 16px is an
       illegible grey circle, and every film site already uses one. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2e88"/>
      <stop offset="1" stop-color="#8c3cff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0d0d0f"/>
  <rect x="8" y="8" width="496" height="496" rx="106" fill="none"
        stroke="url(#g)" stroke-width="16" opacity="0.5"/>
  <text x="256" y="356" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="320"
        font-weight="400" fill="url(#g)">&#937;</text>
</svg>
