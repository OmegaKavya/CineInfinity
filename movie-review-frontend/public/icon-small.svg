<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Small-size variant. The plated version loses its glyph at 16px: the
       rounded square and its stroke eat most of the canvas and the omega
       collapses to a smudge. Here the letterform fills the box instead. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d9a"/>
      <stop offset="1" stop-color="#9d5cff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="72" fill="#0d0d0f"/>
  <text x="256" y="420" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="470"
        font-weight="400" fill="url(#g)">&#937;</text>
</svg>
