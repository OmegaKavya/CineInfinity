<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CineInfinity has moved</title>
    <link rel="canonical" href="https://cineinfinity.web.app/" />
    <meta name="robots" content="noindex" />
    <!-- Firebase Hosting's own redirects did not apply on this site, and an
         unverified redirect is worse than none. This page is served for every
         path here and forwards to the same path on the named host, so an old
         deep link still lands where it meant to. -->
    <script>
      (function () {
        var target = 'https://cineinfinity.web.app' +
          window.location.pathname + window.location.search + window.location.hash;
        window.location.replace(target);
      })();
    </script>
    <style>
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #0d0d0f; color: #f2f2f2; text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 1rem;
      }
      a { color: #ff4d9a; }
    </style>
  </head>
  <body>
    <!-- Shown only if scripting is off, so the move is never a dead end. -->
    <main>
      <p>CineInfinity now lives at</p>
      <p><a href="https://cineinfinity.web.app/">cineinfinity.web.app</a></p>
    </main>
  </body>
</html>
